<!-- Memory is a single-canvas UI, not panel-per-tab: one #entries list that
     swaps content as switchTab() loads each Hall, plus the search bar (Search
     tab) and #overview-section (Overview tab). Wrapped in .halls for the page
     padding the shell's .view would normally give (this content isn't a .view).
     The connection modal is gone - the shell's 🔑 token modal + same-origin
     api() replace it. The migration overlay is injected by scripts.js. -->
<div class="halls">
    <div id="error-slot"></div>

    <div class="searchbar" id="searchbar" style="display:none;">
        <input type="text" id="search-query" placeholder="semantic query across all tiers…" />
        <label><input type="checkbox" id="inc-short" checked /> short</label>
        <label><input type="checkbox" id="inc-near" checked /> near</label>
        <label><input type="checkbox" id="inc-long" checked /> long</label>
        <label>n=<input type="number" id="search-n" value="10" min="1" max="50" style="width:62px;" /></label>
        <button class="btn" id="do-search">search</button>
    </div>

    <div class="toolbar" id="list-toolbar">
        <span class="hint" id="list-hint"></span>
        <div class="spacer"></div>
        <label class="hint" id="extra-toggle-wrap" style="display:none;">
            <input type="checkbox" id="extra-toggle" /> <span id="extra-label"></span>
        </label>
    </div>

    <div class="entries" id="entries"></div>
    <div id="overview-section" style="display:none;"></div>

    <!-- The Map (23 Oct 2026): long-term as a constellation. The scene fills
         #map-canvas; the controls, legend and the selected memory float over it. -->
    <div id="map-section" style="display:none;">
        <div id="map-canvas"></div>
        <div class="map-controls">
            <div class="map-seg" role="group" aria-label="Layout">
                <button class="map-seg-btn on" data-layout="meaning" title="Placed by what each memory means">Meaning</button>
                <button class="map-seg-btn" data-layout="constellation" title="Pulled together by what hangs on what">Constellation</button>
            </div>
            <label class="map-check"><input type="checkbox" id="map-sats" checked /> satellites</label>
            <label class="map-check"><input type="checkbox" id="map-rotate" checked /> drift</label>
            <input type="search" id="map-search" placeholder="light up…" aria-label="Light up memories that mention" />
            <button class="map-btn" id="map-fit" title="Fit everything in view">⌖</button>
        </div>
        <div class="map-legend">
            <div class="map-stats" id="map-stats"></div>
            <div><i class="lg-core"></i>core <span class="faint">(size: evidence)</span></div>
            <div><i class="lg-sat"></i>satellite</div>
            <div><i class="lg-verb"></i>kept verbatim</div>
            <div><i class="lg-bridge"></i>bridge: one episode, two stories</div>
            <div><i class="lg-hist"></i>an older wording</div>
        </div>
        <div class="map-info" id="map-info" hidden></div>
        <div class="map-loading" id="map-loading">charting…</div>
    </div>
</div>
