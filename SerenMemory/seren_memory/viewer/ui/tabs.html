<!-- The nine Halls. Shell contract: class="tab" data-tab="<tier>" so the shell
     styles them (underline) + auto-activates the first. onclick routes through
     the leaf switchTab(), which drives the single-canvas content + lazy load.
     The .dot is leaf-styled per tier (see styles.css). -->
<button class="tab" data-tab="short" onclick="switchTab('short')">ShortTerm</button>
<button class="tab" data-tab="near" onclick="switchTab('near')">NearTerm</button>
<button class="tab" data-tab="long" onclick="switchTab('long')">LongTerm</button>
<button class="tab" data-tab="map" onclick="switchTab('map')">Map</button>
<button class="tab" data-tab="eidetic" onclick="switchTab('eidetic')">Eidetic</button>
<button class="tab" data-tab="briefs" onclick="switchTab('briefs')">Briefs</button>
<button class="tab" data-tab="drafts" onclick="switchTab('drafts')">Drafts</button>
<button class="tab" data-tab="search" onclick="switchTab('search')">Search</button>
<button class="tab" data-tab="overview" onclick="switchTab('overview')">Overview</button>
