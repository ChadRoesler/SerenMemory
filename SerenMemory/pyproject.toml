[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-memory"
dynamic = ["version"]
description = "Three-tier LLM memory with consolidation for Seren. The right brain - episodic, time-tiered, dreaming the durable out of the fleeting. The Halls of Memory."
readme = "README.md"
# Upper bound is the chromadb wall, not ours: SerenMemory itself is fine on
# 3.13+, but chromadb's transitive deps don't build there yet (an lz4 wheel
# build failure). Capping here turns a cryptic transitive build explosion into
# a clean "needs a different Python" from pip. LIFT THE <3.13 the day chromadb
# ships 3.13 support (bump the CI matrix to match in the same commit).
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Chad Roesler" }]
keywords = ["llm", "memory", "vector-db", "chromadb", "consolidation", "seren"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    # Named embedding models (storage.embedding_model) build a chroma
    # SentenceTransformerEmbeddingFunction, which needs this. chroma's DEFAULT
    # embedder is bundled (ONNX MiniLM-L6) so the zero-config path doesn't
    # touch it - but the moment an operator picks a model, or runs an embedder
    # migration, it's required. Declaring it core (not an extra) means the
    # embedder knob and migration 'just work' rather than exploding at runtime
    # with a bare ImportError. Python<3.13 cap above already keeps torch's
    # 3.13 gap out of scope.
    "sentence-transformers>=3.0",
    # The shared Seren core: token resolution, the version helper, the viewer
    # baseplate, AND now the bearer-auth middleware - Memory was folded into the
    # family's shared auth (its 401 body is now the family's {"detail":...}).
    # The ONE Memory-specific piece that stays local is the embedder safe-mode
    # 503 gate, its own middleware mounted outside bearer. Pinned <1 - a MAJOR
    # (an un-defaultable security change) is the only thing that forces a bump.
    "seren-meninges>=2.1.0,<3",
    # Shared request logging - one copy across the family (SerenSinew). Mounted
    # outermost (before auth) so even safe-mode 503s and 401s get logged.
    # -> memory-requests.log.
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
mcp = [
    # The Python MCP SDK from Anthropic. FastMCP (the high-level server
    # API) was merged into the main SDK; this single dep gives us both.
    #
    # THE <2 CAP IS LOAD-BEARING: mcp 2.0.0 REMOVED FastMCP outright.
    # `mcp.server.fastmcp` does not exist in 2.x; the server class is now
    # mcp.server.mcpserver.MCPServer with a different API. Last 1.x that
    # still carries FastMCP is 1.29.0. Uncapped, a fresh install resolves
    # 2.0.0, the import fails, app.py's ImportError gate catches it exactly
    # as designed, and the service comes up in HTTP-only mode with one log
    # line - i.e. /mcp silently ceases to exist and looks like the extra
    # just wasn't installed. Cap it, don't hope. (SerenWorkbench hit this
    # in CI; it only screamed there because its tests POST /mcp
    # unconditionally. This service has no such canary.)
    #
    # Lift the cap in the same commit that ports server.py to the MCPServer
    # API - across the whole family at once, since they're copies.
    # Within 1.x the pin stays loose: server.py already tolerates the
    # streamable_http->sse transport-name drift across recent versions.
    "mcp>=1.0,<2",
]
corp = [
    # Corporate / intercepting-proxy support. Routes Python TLS through the OS
    # trust store so a corp root CA (Zscaler/Netskope/etc.) is honored without
    # hand-exporting .pem files. Opt-in: `pip install seren-memory[corp]`.
    # Enable at runtime with `tls.trust_system_store: true` (the --corp installer
    # flag sets both for you). truststore needs Python 3.10+, which we already
    # require.
    "truststore>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # starlette >= 0.43 emits StarletteDeprecationWarning when fastapi.testclient
    # falls back to httpx; installing httpx2 silences it and future-proofs the
    # test stack against the upcoming hard cutover.
    "httpx2>=2.3",
]
# "is there a newer seren-lodestar" reporting on GET /. Opt-in, because a
# service that never leaves a LAN has no reason to talk to PyPI. Pulls the
# Meninges extra rather than httpx/packaging directly - the check lives in
# seren_meninges.updates and only one repo should own that dep set.
#
# The floor matches the core dep above: updates.py landed in 2.0.0 and updates_payload in 2.1.0.
# Resolve anything older and the lifespan import fails, leaving you with
# status="unavailable" forever and no obvious reason why.
updates = ["seren-meninges[updates]>=2.1.0,<3"]

[project.scripts]
seren-memory = "seren_memory.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenMemory"
Repository = "https://github.com/ChadRoesler/SerenMemory"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenMemory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_memory*"]

# Ship the viewer fragment files inside the wheel: the leaf bricks in
# viewer/ui/ that render_from_dir snaps onto the SerenMeninges baseplate.
# Without this, pip strips non-.py files and GET /viewer renders an empty
# shell on an installed copy (works in dev checkout, silently breaks once
# installed - the classic package-data gotcha).
[tool.setuptools.package-data]
seren_memory = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root)
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_memory/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"